  showModal(`<div class="sheet" role="dialog" aria-modal="true">
    <header><h2>${it?'Edit':'Add a '+(d.noun||'item')}</h2>
      <button class="btn btn-quiet btn-sm" onclick="closeModal()">Close</button></header>
    <div class="content">
      <div class="photo-pick">
        <div class="photo-gallery" id="prev"></div>
        <div class="photo-acts">
          <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide" onchange="handleFiles(event)">
          <input type="file" id="fileLib" accept="image/*" multiple class="hide" onchange="handleFiles(event)">
          <button type="button" class="btn btn-sm" onclick="document.getElementById('fileCam').click()">📷 Take a photo</button>
          <button type="button" class="btn btn-sm" onclick="document.getElementById('fileLib').click()">Choose photos</button>
          <button type="button" class="btn btn-sm" onclick="findPhoto()">Find one online</button>
          <div class="linkrow">
            <input class="input" id="f_imageurl" placeholder="…or paste an image link">
            <button type="button" class="btn btn-sm" onclick="addImageLink()">Add</button>
          </div>
          <p class="hint" id="photoHint" style="margin:0">Up to ${PHOTOS_PER_ITEM} photos per item.</p>
        </div>
      </div>
      ${d.fields.map(f=>fieldHTML(f, it ? it.fields[f.key] : (f.key==='owner'?defOwner:''))).join('')}
      <div id="lifespanNote"></div>
    </div>
    <footer>
      ${it?`<button class="btn btn-danger btn-sm" onclick="removeItem('${it.id}')">Delete</button>`:''}
      <span class="grow"></span>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem('${it?it.id:''}')">${it?'Save changes':'Add to '+esc(d.name)}</button>
    </footer>
  </div>`);
  drawPrev();
  refreshAgeNote();
  refreshLifespanNote();
  ['brand','model','purpose'].forEach(k=>{
    const el = $('#f_'+k);
    if(el) el.addEventListener('change', refreshLifespanNote);
    if(k==='purpose') $('#f_purpose')?.addEventListener('click', ()=>setTimeout(refreshLifespanNote,0));
  });
}
/* Age ticks over from the Bought month as soon as it's picked. */
function refreshAgeNote(){
  const note = $('#ageNote'); if(!note) return;
  const v = $('#f_purchased')?.value;
  const months = v && /^\d{4}-\d{2}$/.test(v) ? ageMonths({fields:{purchased:v}}) : null;
  note.textContent = months === null ? '' : 'That makes it ' + monthsLabel(months) + ' old.';
  refreshLifespanNote();
}
/* Typical lifespan for whatever brand/model/purpose is currently selected. */
function refreshLifespanNote(){
  const box = $('#lifespanNote'); if(!box) return;
  const d = drawer(ACTIVE);
  const mode = d.lifespan || (d.id==='shoes' ? 'shoes' : 'manual');
  if(mode === 'none'){ box.innerHTML = ''; return; }

  if(mode === 'manual'){
    /* No published figures for bags or tumblers — these are yours to fill in. */
    box.innerHTML = `<div class="lifebox">
      <div class="lifebox-h">Typical life of ${esc(d.noun ? 'a '+d.noun : d.name.toLowerCase())}</div>
      <p class="hint" style="margin:0 0 .6rem">However long you'd expect one to last before replacing it. Leave blank if you'd rather not track it.</p>
      <div class="row2">
        <div class="field" style="margin-bottom:0"><label class="lbl" for="f_lifeDaily">Almost daily</label>
          <input class="input" id="f_lifeDaily" placeholder="e.g. 2 years" value="${esc($('#f_lifeDaily')?.value || LIFE_DRAFT.daily || '')}"></div>
        <div class="field" style="margin-bottom:0"><label class="lbl" for="f_lifeWeekly">1–2× a week</label>
          <input class="input" id="f_lifeWeekly" placeholder="e.g. 5 years" value="${esc($('#f_lifeWeekly')?.value || LIFE_DRAFT.weekly || '')}"></div>
      </div>
      <button type="button" class="linklike" style="margin-top:.6rem" onclick="lookupLifespan()">Look this up on the web</button>
    </div>`;
    return;
  }

  const probe = {drawerId:d.id, fields:{
    brand: $('#f_brand')?.value || '',
    model: $('#f_model')?.value || '',
    purpose: $$('#f_purpose .chip[aria-pressed="true"]').map(b=>b.textContent.trim()),
    purchased: $('#f_purchased')?.value || ''
  }};
  if(!probe.fields.model && !probe.fields.purpose.length){ box.innerHTML = ''; return; }
  const L = lifespanFor(probe, d);
  box.innerHTML = `<div class="lifebox">
    <div class="lifebox-h">${esc(L.title)}</div>
    <dl class="lifegrid">
      <dt>Almost daily</dt><dd>${esc(L.daily)}</dd>
      <dt>1–2× a week</dt><dd>${esc(L.weekly)}</dd>
      ${L.miles?`<dt>Distance</dt><dd>${esc(L.miles)} · about ${esc(L.steps)}</dd>`:''}
    </dl>
    ${L.note?`<p class="hint" style="margin:.5rem 0 0">${esc(L.note)}</p>`:''}
    ${probe.fields.model ? `<button type="button" class="linklike" style="margin-top:.5rem" onclick="lookupLifespan()">Check the web for this exact model</button>` : ''}
  </div>`;
}
let LIFE_DRAFT = {daily:'', weekly:''};
function lookupLifespan(){
  const d = drawer(ACTIVE);
  const bits = [$('#f_brand')?.value, $('#f_model')?.value].filter(Boolean).join(' ').trim();
  const bought = $('#f_purchased')?.value ? ' bought ' + monthName($('#f_purchased').value) : '';
  const q = (bits || d.name) + ' how long do they last replace' + bought;
  window.open('https://www.google.com/search?q='+encodeURIComponent(q.trim()), '_blank', 'noopener');
}
function drawPrev(){
  const p = $('#prev'); if(!p) return;
  if(!formPhotos.length){ p.innerHTML = `<div class="photo-empty">No photos yet — add one below</div>`; return; }
  p.innerHTML = formPhotos.map((src,i)=>`<div class="photo-thumb"><img src="${esc(src)}" alt="" onerror="this.parentElement.style.display='none'"><button type="button" class="rm" title="Remove" onclick="removePhoto(${i})">✕</button></div>`).join('');
}
function removePhoto(i){ formPhotos.splice(i,1); drawPrev(); }
function addImageLink(){
  const el = $('#f_imageurl'); const v = (el.value||'').trim();
  if(!v){ toast('Paste a link first.'); return; }
  if(formPhotos.length >= PHOTOS_PER_ITEM){ toast(`That's the limit of ${PHOTOS_PER_ITEM} photos — remove one first.`); return; }
  formPhotos.push(v); el.value=''; drawPrev();
}
/* Resize + compress before storing, so photos captured on a phone camera
   (often several MB each) stay well inside the size limit for local/shared
   storage. Ramps quality down further if a shot is still large after resizing. */
const PHOTO_MAX_DIM = 1000, PHOTO_MAX_BYTES = 150*1024;
const PHOTOS_PER_ITEM = 4;   // four at this size sit safely inside one Firestore document
function compressDataUrl(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = () => {
      /* Drop quality first, since that costs the least visually. A busy photo
         can bottom out at minimum quality and still be too big, so after that
         shrink the picture itself — otherwise the size ceiling is a wish
         rather than a limit, and one photo can fill a whole sync document. */
      let dim = PHOTO_MAX_DIM, out = null;
      for(let pass = 0; pass < 4; pass++){
        const sc = Math.min(1, dim/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width  = Math.max(1, Math.round(img.width * sc));
        c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.82;
        out = c.toDataURL('image/jpeg', q);
        while(out.length * 0.75 > PHOTO_MAX_BYTES && q > 0.35){
          q -= 0.1; out = c.toDataURL('image/jpeg', q);
        }
        if(out.length * 0.75 <= PHOTO_MAX_BYTES) break;
        dim = Math.round(dim * 0.7);              // still too heavy — make it smaller
      }
      resolve(out);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function handleFiles(e){
  let files = Array.from(e.target.files || []); if(!files.length) return;
  const room = PHOTOS_PER_ITEM - formPhotos.length;
  if(room <= 0){ toast(`That's the limit of ${PHOTOS_PER_ITEM} photos — remove one first.`); e.target.value=''; return; }
  if(files.length > room){ files = files.slice(0, room); toast(`Room for ${room} more — keeping the first ${room}.`); }
  const hint = $('#photoHint'); if(hint) hint.textContent = `Compressing ${files.length>1?files.length+' photos':'photo'}…`;
  Promise.all(files.map(file => new Promise(res=>{
    const r = new FileReader();
    r.onload = () => compressDataUrl(r.result).then(res);
    r.readAsDataURL(file);
  }))).then(list=>{
    formPhotos.push(...list);
    drawPrev();
    if(hint) hint.textContent = `Up to ${PHOTOS_PER_ITEM} photos per item.`;
    e.target.value = '';
  });
}
function findPhoto(){
  const bits = [$('#f_brand')?.value, $('#f_model')?.value, $('#f_color')?.value].filter(Boolean);
  const q = bits.join(' ') || drawer(ACTIVE).name;
  window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q), '_blank', 'noopener');
  toast('Save the image, then use Choose photos.');
}
function readForm(d){
  const out = {};
  d.fields.forEach(f=>{
    if(f.type==='tags') out[f.key] = $$('#f_'+f.key+' .chip[aria-pressed="true"]').map(b=>b.textContent.trim());
    else out[f.key] = ($('#f_'+f.key)?.value || '').trim();
  });
  return out;
}
function saveItem(id){
  const d = drawer(ACTIVE);
  const fields = readForm(d);
  /* manual lifespan figures live alongside the drawer's own fields */
  if($('#f_lifeDaily'))  fields.lifeDaily  = $('#f_lifeDaily').value.trim();
  if($('#f_lifeWeekly')) fields.lifeWeekly = $('#f_lifeWeekly').value.trim();
  /* The name is no longer typed — it's simply the brand and model. */
  const name = [fields.brand, fields.model].filter(Boolean).join(' ').trim()
            || fields.size || d.noun || 'Item';
  if(!fields.brand && !fields.model){ toast('Pick a brand or a model first.'); return; }
  if(id){
    const it = DB.items.find(x=>x.id===id);
    Object.assign(it, {name, fields, images:formPhotos.slice()});
  }else{
    DB.items.push({id:uid(), drawerId:d.id, name, images:formPhotos.slice(), fields, createdAt:Date.now()});
  }
  save(); closeModal(); renderTabs(); renderRail(); renderGrid();
  toast(id ? 'Saved.' : `Added to ${d.name}.`);
}
function removeItem(id){
  const it = DB.items.find(x=>x.id===id); if(!it) return;
  const label = [it.fields.brand, it.fields.model].filter(Boolean).join(' ') || it.name;
  askConfirm({
    title: 'Remove this one?',
    body: `<strong>${esc(label)}</strong> will be deleted from ${esc(drawer(it.drawerId).name)}, along with its photos. This cannot be undone, and it disappears for both of you.`,
    confirmLabel: 'Yes, delete it',
    danger: true,
    onYes(){
      DB.items = DB.items.filter(x=>x.id!==id);
      save(); closeModal(); renderTabs(); renderRail(); renderGrid();
      toast('Deleted.');
    }
  });
}
/* A confirmation that looks like the rest of the app, and works inside the
   installed app where the browser's own dialogs are easy to miss. */
let confirmAction = null;
function askConfirm({title, body, confirmLabel, danger, onYes}){
  confirmAction = onYes;
  const prev = $('#modals').innerHTML;
  $('#modals').insertAdjacentHTML('beforeend', `<div class="scrim" id="confirmScrim" style="z-index:70">
    <div class="sheet" role="alertdialog" aria-modal="true" style="max-width:420px">
      <header><h2>${esc(title)}</h2></header>
      <div class="content"><p style="margin:0">${body}</p></div>
      <footer>
        <span class="grow"></span>
        <button class="btn" onclick="closeConfirm()">Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" onclick="runConfirm()">${esc(confirmLabel||'Confirm')}</button>
      </footer>
    </div>
  </div>`);
}
function closeConfirm(){ $('#confirmScrim')?.remove(); confirmAction = null; }
function runConfirm(){ const fn = confirmAction; closeConfirm(); if(fn) fn(); }

/* ---------- H. ITEM DETAIL ------------------------------------------------ */
let DETAIL_IMAGES = [];
function openDetail(id){
  const it = DB.items.find(x=>x.id===id); if(!it) return;
  const d = drawer(it.drawerId);
  const hex = hexOf(it.fields.color);
  const imgs = (it.images||[]).filter(Boolean);
  DETAIL_IMAGES = imgs;
  const hero = imgs.length
    ? `<img src="${esc(imgs[0])}" alt="${esc(it.name)}" id="heroImg">`
    : `<div class="ph" style="position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,${hex},${hex}CC);font-family:var(--font-display);font-size:2.2rem;color:#fff">${esc(initials(it.fields.brand||it.name))}</div>`;
  const thumbs = imgs.length>1 ? `<div class="detail-thumbs">${imgs.map((src,i)=>`<button type="button" class="dthumb${i===0?' active':''}" onclick="switchDetailPhoto(${i})"><img src="${esc(src)}" alt=""></button>`).join('')}</div>` : '';
  const rows = d.fields.map(f=>{
    const v = it.fields[f.key];
    if(!v || (Array.isArray(v)&&!v.length)) return '';
    let disp = Array.isArray(v) ? v.map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')
      : f.type==='color' ? `<span class="tag"><i class="dot" style="background:${hexOf(v)}"></i>${esc(v)}</span>`
      : f.key==='owner' ? `<span class="tag tag-owner" style="background:${ownerColor(v)}">${esc(v)}</span>`
      : f.type==='month' ? esc(monthName(v)) + ' <span class="hint" style="display:inline">· ' + esc(monthsLabel(ageMonths(it))) + ' old</span>'
      : esc(v);
    return `<dt>${esc(f.label)}</dt><dd>${disp}</dd>`;
  }).join('');
  const L = lifespanFor(it, d);
  const verdict = !L ? '' : L.verdict === 'past-due'
      ? `<p class="lifeflag lifeflag-warn">Older than the usual life even at one or two wears a week — worth checking the midsole and tread.</p>`
    : L.verdict === 'daily-done'
      ? `<p class="lifeflag">Past the usual life if it's been worn almost daily, still within range at one or two wears a week.</p>`
    : '';
  const lifeHTML = !L ? '' : `<div class="lifebox" style="margin-top:1rem">
      <div class="lifebox-h">${esc(L.title)}</div>
      <dl class="lifegrid">
        ${L.daily?`<dt>Almost daily</dt><dd>${esc(L.daily)}</dd>`:''}
        ${L.weekly?`<dt>1–2× a week</dt><dd>${esc(L.weekly)}</dd>`:''}
        ${L.miles?`<dt>Distance</dt><dd>${esc(L.miles)} · about ${esc(L.steps)}</dd>`:''}
        ${L.age!==null?`<dt>This one</dt><dd>${esc(monthsLabel(L.age))} old</dd>`:''}
      </dl>
      ${verdict}
      ${L.note?`<p class="hint" style="margin:.5rem 0 0">${esc(L.note)}</p>`:''}
    </div>`;
  showModal(`<div class="sheet" role="dialog" aria-modal="true">
    <header><h2>${nameBlock(it)}</h2><button class="btn btn-quiet btn-sm" onclick="closeModal()">Close</button></header>
    <div class="content">
      <div class="detail-hero">${hero}</div>
      ${thumbs}
      ${wearPanelHTML(it)}
      <dl class="spec">${rows}</dl>
      ${lifeHTML}
    </div>
    <footer>
      <button class="btn btn-danger btn-sm" onclick="removeItem('${it.id}')">Delete</button>
      <span class="grow"></span>
      <button class="btn btn-primary" onclick="closeModal();openForm('${it.id}')">Edit</button>
    </footer>
  </div>`);
}
/* The wear log, as it appears inside an item. The warning when you've worn
   something in the last few days is the point of the whole thing — it's what
   stops the same pair going on four days running without you noticing. */
function wearPanelHTML(it){
  const f = usageFlag(it);
  const w = wearsOf(it);
  const recent = w.slice(-6).reverse();
  const last90 = wearsWithin(it, 90);
  const people = Object.keys(DB.users || {});
  if(!WEAR_WHO || !people.includes(WEAR_WHO)) WEAR_WHO = ME || people[0] || '';
  const already = w.some(x => wearDay(x)===todayISO() && wearBy(x)===WEAR_WHO);
  return `<div class="wearbox wear-${f.kind}">
    <div class="wearhead">
      <span class="wearflag wear-${f.kind}">${esc(f.text)}</span>
      <span class="hint">${esc(f.detail)}</span>
    </div>
    ${f.kind === 'hot' ? `<p class="lifeflag" style="margin:.5rem 0 0">You've had these on very recently — maybe give them a day off.</p>` : ''}
    ${f.kind === 'idle' ? `<p class="lifeflag" style="margin:.5rem 0 0">These have been sitting at the back for a while. Worth wearing or passing on.</p>` : ''}
    <div class="wearstats">
      <span><strong>${w.length}</strong> wear${w.length===1?'':'s'} logged</span>
      <span><strong>${last90}</strong> in the last 3 months</span>
    </div>
    ${people.length > 1 ? `<div class="wearwho">
      <span class="lbl" style="margin:0">Worn by</span>
      ${people.map(n=>`<button type="button" class="chip" aria-pressed="${n===WEAR_WHO}" onclick="setWearWho('${jsq(n)}','${it.id}')">
        <i class="dot" style="background:${ownerColor(n)}"></i>${esc(n)}</button>`).join('')}
    </div>` : ''}
    <div class="wearacts">
      <button class="btn btn-sm ${already?'':'btn-brass'}" ${already?'disabled':''} onclick="markWorn('${it.id}')">
        ${already ? `Logged for ${esc(WEAR_WHO||'today')} ✓` : 'Wore this today'}
      </button>
      <input class="input" type="date" id="wearDate" max="${todayISO()}" style="width:auto">
      <button class="btn btn-sm" onclick="markWorn('${it.id}', document.getElementById('wearDate').value)">Add that day</button>
    </div>
    ${recent.length ? `<div class="wearlist">
      ${recent.map(x=>{
        const d = wearDay(x), by = wearBy(x);
        return `<span class="weartag">
          ${by ? `<i class="dot" style="background:${ownerColor(by)}" title="${esc(by)}"></i>` : ''}
          ${esc(prettyDay(d))}${by ? ' · ' + esc(by) : ''}
          <button onclick="removeWear('${it.id}','${d}','${jsq(by)}')" title="Remove">✕</button></span>`;
      }).join('')}
      ${w.length > 6 ? `<span class="hint" style="align-self:center">+${w.length-6} more</span>` : ''}
    </div>` : ''}
  </div>`;
}
/* Who the next log is recorded against — defaults to whoever is signed in. */
let WEAR_WHO = null;
function setWearWho(name, itemId){
  WEAR_WHO = name;
  const it = DB.items.find(x=>x.id===itemId);
  if(it) refreshWearPanel(it);
}
function prettyDay(iso){
  const n = daysSince(iso);
  if(n === 0) return 'Today';
  if(n === 1) return 'Yesterday';
  const d = new Date(iso + 'T00:00:00');
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, sameYear ? {day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'});
}
function markWorn(id, iso){
  const it = DB.items.find(x=>x.id===id); if(!it) return;
  if(iso && !/^\d{4}-\d{2}-\d{2}$/.test(iso)){ toast('Pick a date first.'); return; }
  if(iso && daysSince(iso) < 0){ toast("That's in the future."); return; }
  const who = WEAR_WHO || ME || '';
  if(!logWear(it, iso, who)){ toast(`Already logged for ${who||'that day'}.`); return; }
  save(); renderGrid();
  refreshWearPanel(it);
  toast(`Logged${who ? ' for ' + who : ''}${iso ? ', ' + prettyDay(iso) : ''}.`);
}
function removeWear(id, iso, by){
  const it = DB.items.find(x=>x.id===id); if(!it) return;
  unlogWear(it, iso, by);
  save(); renderGrid();
  refreshWearPanel(it);
}
function refreshWearPanel(it){
  const box = document.querySelector('.wearbox');
  if(box) box.outerHTML = wearPanelHTML(it);
}
function switchDetailPhoto(i){
  const img = $('#heroImg'); if(img && DETAIL_IMAGES[i]) img.src = DETAIL_IMAGES[i];
  $$('.dthumb').forEach((b,idx)=>b.classList.toggle('active', idx===i));
}

/* ---------- H2. CHAT ------------------------------------------------------
   A single shared document holding the last 300 messages, so both of you can
   talk about what's in here without leaving the app. Offline, it simply says
   so rather than pretending a message was sent.                           */
let CHAT = [], chatOpen = false;
const CHAT_SEEN_KEY = 'cabinet.chatSeen';
const CHAT_LIMIT = 300;

function chatSeenAt(){ try{ return Number(localStorage.getItem(CHAT_SEEN_KEY)||0); }catch(e){ return 0; } }
function markChatSeen(){
  const last = CHAT.length ? CHAT[CHAT.length-1].at : Date.now();
  try{ localStorage.setItem(CHAT_SEEN_KEY, String(last)); }catch(e){}
  paintChatBadge();
}
function unreadCount(){
  const seen = chatSeenAt();
  return CHAT.filter(m => m.at > seen && m.from !== ME).length;
}
function paintChatBadge(){
  const dot = $('#chatDot'); if(!dot) return;
  const n = unreadCount();
  dot.classList.toggle('hide', n === 0);
  dot.textContent = n > 9 ? '9+' : String(n);
}
function startChat(){
  Cloud.watchChat(msgs => {
    CHAT = Array.isArray(msgs) ? msgs : [];
    paintChatBadge();
    if(chatOpen) paintChat();
  });
}
function openChat(){
  chatOpen = true;
  showModal(`<div class="sheet" role="dialog" aria-modal="true" style="max-width:520px">
    <header><h2>Chat</h2><button class="btn btn-quiet btn-sm" onclick="closeChat()">Close</button></header>
    <div class="content" id="chatBody" style="min-height:240px"></div>
    <footer>
      <input class="input" id="chatInput" placeholder="Message ${esc(Object.keys(DB.users||{}).filter(n=>n!==ME)[0] || 'the others')}…" autocomplete="off" style="flex:1"
             onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat();}">
      <button class="btn btn-primary" onclick="sendChat()">Send</button>
    </footer>
  </div>`);
  paintChat();
  markChatSeen();
  setTimeout(()=>$('#chatInput')?.focus(), 60);
}
function closeChat(){ chatOpen = false; markChatSeen(); closeModal(); }
function paintChat(){
  const body = $('#chatBody'); if(!body) return;
  if(!Cloud.hasClient()){
    body.innerHTML = `<p class="hint">Chat needs the shared database, and this device isn't connected to it right now.</p>`;
    return;
  }
  if(!CHAT.length){
    body.innerHTML = `<p class="hint">Nothing here yet. Say something — it shows up on the other phone straight away.</p>`;
    return;
  }
  const seen = chatSeenAt();
  body.innerHTML = CHAT.map(m=>{
    const mine = m.from === ME;
    const fresh = !mine && m.at > seen;
    return `<div class="msg ${mine?'msg-mine':''}">
      <div class="msg-b${fresh?' msg-new':''}">
        ${mine?'':`<span class="msg-who" style="color:${ownerColor(m.from)}">${esc(m.from)}</span>`}
        <span class="msg-t">${esc(m.text)}</span>
        <span class="msg-at">${esc(chatTime(m.at))}</span>
      </div>
    </div>`;
  }).join('');
  body.scrollTop = body.scrollHeight;
}
function chatTime(ts){
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return sameDay ? t : d.toLocaleDateString([], {day:'numeric', month:'short'}) + ' ' + t;
}
async function sendChat(){
  const el = $('#chatInput'); if(!el) return;
  const text = el.value.trim(); if(!text) return;
  if(!Cloud.hasClient()){ toast('No connection to the shared cabinet — message not sent.'); return; }
  const msg = {id:uid(), from:ME||'Someone', text:text.slice(0,2000), at:Date.now()};
  const next = [...CHAT, msg].slice(-CHAT_LIMIT);
  el.value = '';
  CHAT = next; paintChat();
  try{
    await Cloud.pushChat(next);
    markChatSeen();
  }catch(e){
    console.warn(e);
    toast('Could not send that — check the connection.');
  }
}

/* ---------- H3. OUTFIT ADVISOR -------------------------------------------
   Describe or photograph what you're wearing and get back things from this
   cabinet that would go with it.

   This runs entirely on the device — no API key, no account, no bill, and
   nothing leaves the phone. Colours come out of the photo with a canvas, and
   the matching is ordinary colour theory plus how dressed-up the occasion is.
   If an assistant address is ever set in Settings, that's used instead; with
   none set, everything below still works.                                */

/* Each basic colour placed on the wheel, and whether it behaves as a neutral. */
const COLOR_TRAITS = {
  black:{family:'neutral',neutral:true},   white:{family:'neutral',neutral:true},
  grey:{family:'neutral',neutral:true},    silver:{family:'neutral',neutral:true},
  beige:{family:'neutral',neutral:true},   cream:{family:'neutral',neutral:true},
  brown:{family:'orange', neutral:true},   navy:{family:'blue',   neutral:true},
  gold:{family:'yellow',  neutral:false},  red:{family:'red',     neutral:false},
  pink:{family:'red',     neutral:false},  orange:{family:'orange',neutral:false},
  yellow:{family:'yellow',neutral:false},  green:{family:'green', neutral:false},
  olive:{family:'green',  neutral:true},   teal:{family:'teal',   neutral:false},
  blue:{family:'blue',    neutral:false},  purple:{family:'purple',neutral:false},
  multi:{family:'multi',  neutral:false}
};
const COMPLEMENTS = {blue:'orange', orange:'blue', red:'green', green:'red',
                     yellow:'purple', purple:'yellow', teal:'red'};
const ANALOGOUS = {blue:['teal','purple'], teal:['blue','green'], green:['teal','yellow','olive'],
                   yellow:['green','orange'], orange:['yellow','red'], red:['orange','purple'],
                   purple:['red','blue']};
const traitsOf = name => COLOR_TRAITS[String(name||'').toLowerCase()] || null;

/* How dressed-up something is: 0 sporty, 1 casual, 2 smart. */
const PURPOSE_FORMALITY = {running:0,gym:0,trail:0,hybrid:0,badminton:0,pickle:0,pickleball:0,
  walking:1,travel:1,everyday:1,trekking:1,luggage:1,
  office:2,occasion:2};
const OCCASION_WORDS = [
  [2, /\b(wedding|dinner|formal|smart|office|work|meeting|interview|church|date|party|event|suit|blazer|dress|heels|slacks|chinos|trousers|skirt)\b/i],
  [0, /\b(gym|run(ning)?|workout|training|lift(ing)?|jog|sport|athletic|leggings|shorts|tracksuit)\b/i],
  [1, /\b(casual|weekend|jeans|denim|t-?shirt|tee|hoodie|errands|mall|coffee|travel(ling)?|walk)\b/i]
];
function formalityOf(text){
  for(const [level, re] of OCCASION_WORDS) if(re.test(text)) return level;
  return 1;                                   // assume everyday if unsaid
}
function itemFormality(it){
  const levels = asArr(it.fields.purpose)
    .map(p => PURPOSE_FORMALITY[String(p).toLowerCase().trim()])
    .filter(v => v !== undefined);
  if(!levels.length) return 1;
  return levels.reduce((a,b)=>a+b,0) / levels.length;
}
/* Colour words mentioned in a typed description. */
function coloursInText(text){
  const found = [];
  Object.keys(COLOR_TRAITS).forEach(name=>{
    if(new RegExp('\\b'+name+'\\b','i').test(text)) found.push(name);
  });
  ['ivory','off-white','tan','khaki','maroon','burgundy','charcoal','denim','sand']
    .forEach(w=>{
      if(!new RegExp('\\b'+w+'\\b','i').test(text)) return;
      const map = {ivory:'cream','off-white':'cream',tan:'beige',khaki:'beige',
                   maroon:'red',burgundy:'red',charcoal:'grey',denim:'blue',sand:'beige'};
      if(!found.includes(map[w])) found.push(map[w]);
    });
  return found;
}
/* Pull the main colours straight out of a photo, on the device. */
function coloursInPhoto(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = () => {
      const S = 60;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const ctx = c.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(img, 0, 0, S, S);
      let px;
      try{ px = ctx.getImageData(0,0,S,S).data; }catch(e){ return resolve([]); }
      const tally = {};
      for(let i=0;i<px.length;i+=4){
        if(px[i+3] < 128) continue;
        const name = nearestBasicColour(px[i], px[i+1], px[i+2]);
        tally[name] = (tally[name]||0) + 1;
      }
      const total = Object.values(tally).reduce((a,b)=>a+b,0) || 1;
      resolve(Object.entries(tally)
        .sort((a,b)=>b[1]-a[1])
        .filter(([,n]) => n/total > 0.08)      // ignore incidental specks
        .slice(0,3)
        .map(([name])=>name));
    };
    img.onerror = () => resolve([]);
    img.src = dataUrl;
  });
}
function nearestBasicColour(r,g,b){
  let best = 'grey', bestD = Infinity;
  for(const c of COLORS){
    const h = c.hex.replace('#','');
    const cr = parseInt(h.slice(0,2),16), cg = parseInt(h.slice(2,4),16), cb = parseInt(h.slice(4,6),16);
    /* weighted so it matches how the eye judges closeness */
    const d = 2*(r-cr)**2 + 4*(g-cg)**2 + 3*(b-cb)**2;
    if(d < bestD){ bestD = d; best = c.name.toLowerCase(); }
  }
  return best;
}

/* Score one thing in the cabinet against the outfit. */
function scoreItem(it, outfitColours, level){
  const name = String(it.fields.color||'').toLowerCase();
  const t = traitsOf(name);
  const reasons = [];
  let score = 0;

  const outTraits = outfitColours.map(traitsOf).filter(Boolean);
  const outAllNeutral = outTraits.length > 0 && outTraits.every(o=>o.neutral);

  if(!t){
    score += 0.5;
  } else if(t.family === 'multi'){
    score += 1.5; reasons.push('the mix of colours picks up most things');
  } else if(t.neutral){
    score += 3; reasons.push(`${it.fields.color} is a neutral, so it sits under anything`);
  } else if(outAllNeutral){
    score += 3; reasons.push(`brings some ${name} to an otherwise neutral outfit`);
  } else {
    for(const o of outTraits){
      if(o.neutral) { score += 1.5; continue; }
      if(o.family === t.family){ score += 2; reasons.push(`the ${name} echoes what you're wearing`); }
      else if(COMPLEMENTS[o.family] === t.family){ score += 2.5; reasons.push(`${name} sits opposite the ${o.family}, which makes both stand out`); }
      else if((ANALOGOUS[o.family]||[]).includes(t.family)){ score += 2; reasons.push(`${name} sits next to the ${o.family} on the wheel — an easy match`); }
      else { score -= 1; reasons.push(`${name} fights the ${o.family} a little`); }
    }
  }

  const gap = Math.abs(itemFormality(it) - level);
  const word = ['sporty','everyday','smart'][level];
  let veto = false;
  if(gap <= 0.5){ score += 3; reasons.push(`dressed about right for something ${word}`); }
  else if(gap <= 1.2){ score += 1; }
  else { veto = true; }   // wrong register for the occasion — don't offer it at all

  if((it.images||[]).length) score += 0.2;    // nudge things you've photographed
  return {score, veto, why: reasons.slice(0,2).join(', ')};
}
function suggestLocally(outfitColours, text){
  const level = formalityOf(text);
  const byDrawer = {};
  DB.items.forEach(it=>{
    const s = scoreItem(it, outfitColours, level);
    (byDrawer[it.drawerId] = byDrawer[it.drawerId] || []).push({it, ...s});
  });
  const picks = [];
  Object.keys(byDrawer).forEach(id=>{
    const ranked = byDrawer[id].filter(r=>!r.veto && r.score > 1.5).sort((a,b)=>b.score-a.score);
    ranked.slice(0, id === 'shoes' ? 2 : 1).forEach(r=>picks.push(r));
  });
  picks.sort((a,b)=>b.score-a.score);
  const vetoed = Object.values(byDrawer).flat().some(r=>r.veto);
  return {
    picks: picks.slice(0,4).map(p=>({id:p.it.id, why: p.why ? p.why.charAt(0).toUpperCase()+p.why.slice(1)+'.' : ''})),
    note: picks.length
      ? (vetoed ? 'Anything too sporty or too dressy for the occasion was left out.' : '')
      : 'Nothing in the cabinet really suits that — a neutral would be the safe call if you have one.'
  };
}
const ADVISOR_KEY = 'cabinet.advisor.v1';
function advisorEndpoint(){
  try{ return (JSON.parse(localStorage.getItem(ADVISOR_KEY)||'{}').endpoint || '').trim(); }catch(e){ return ''; }
}
function setAdvisorEndpoint(url){ localStorage.setItem(ADVISOR_KEY, JSON.stringify({endpoint:url})); }

/* Only what's needed to make a suggestion — no photos, no notes. */
function cabinetSummary(){
  return DB.items.map(it=>({
    id: it.id,
    drawer: (drawer(it.drawerId)||{}).name,
    brand: it.fields.brand || '',
    model: it.fields.model || '',
    colour: it.fields.color || '',
    purpose: asArr(it.fields.purpose).join(', '),
    owner: it.fields.owner || ''
  }));
}
let outfitColours = [];
async function askOutfit(){
  const endpoint = advisorEndpoint();
  const text = ($('#of_text')?.value || '').trim();
  const res = $('#ofResult'), go = $('#ofGo');
  if(!text && !outfitPhoto && !outfitColours.length){ toast('Describe the outfit or add a photo.'); return; }
  go.disabled = true;
  res.innerHTML = `<p class="hint">Working it out…</p>`;

  /* An assistant, if one has been set up; otherwise the built-in matching. */
  if(endpoint){
    try{
      const r = await fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({outfit:text, image:outfitPhoto || null, items:cabinetSummary()})
      });
      if(!r.ok) throw new Error('answered ' + r.status);
      renderOutfitPicks(await r.json());
      go.disabled = false;
      return;
    }catch(e){
      console.warn('assistant unavailable, using built-in matching', e);

  let colours = outfitColours.slice();
  if(!colours.length){
    colours = coloursInText(text);
    if(!colours.length && outfitPhoto) colours = await coloursInPhoto(outfitPhoto);
    outfitColours = colours;
  }
  renderDetectedColours();
  renderOutfitPicks(suggestLocally(colours, text));

}
/* Show what it thinks you're wearing, and let it be corrected — guessing

function dropOutfitColour(i){ outfitColours.splice(i,1); renderDetectedColours(); rerunOutfit(); }

/* ---------- H4. CALENDAR + WEEKLY ROSTER ----------------------------------
   The calendar answers "what did I wear, and when". The roster answers the
   opposite question — "what should I wear this week" — by spreading the
   sessions you actually do across the things that suit them, always reaching
   for whatever has gone longest without a wear.                           */
const DEFAULT_ROSTER = [
  {activity:'Office',    perWeek:5},
  {activity:'Gym',       perWeek:3},
  {activity:'Badminton', perWeek:2},
  {activity:'Running',   perWeek:1}
];
function roster(){
  if(!Array.isArray(DB.roster) || !DB.roster.length) DB.roster = clone(DEFAULT_ROSTER);
  return DB.roster;
}
let wearTab = 'calendar', calMonth = null;

function openWear(){
  calMonth = calMonth || todayISO().slice(0,7);
  showModal(`<div class="sheet" role="dialog" aria-modal="true" style="max-width:600px">
    <header><h2>Wear</h2><button class="btn btn-quiet btn-sm" onclick="closeModal()">Close</button></header>
    <div class="content">
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="${wearTab==='calendar'}" onclick="wearTab='calendar';paintWear()">Calendar</button>
        <button role="tab" aria-selected="${wearTab==='roster'}" onclick="wearTab='roster';paintWear()">Weekly roster</button>
        <button role="tab" aria-selected="${wearTab==='neglected'}" onclick="wearTab='neglected';paintWear()">Neglected</button>
      </div>
      <div id="wearBody"></div>
    </div>
  </div>`);
  paintWear();
}
function paintWear(){
  const b = $('#wearBody'); if(!b) return;
  b.innerHTML = wearTab === 'calendar' ? calendarHTML()
              : wearTab === 'roster'   ? rosterHTML()
              : neglectedHTML();
  /* keep the segmented control in step with what's showing */
  const order = ['calendar','roster','neglected'];
  $$('.sheet .seg button').forEach((btn,i)=>btn.setAttribute('aria-selected', String(order[i] === wearTab)));
}

/* ---- calendar ---- */
function wearsByDay(){
  const map = {};
  DB.items.forEach(it => wearsOf(it).forEach(w=>{
    const d = wearDay(w); if(!d) return;
    (map[d] = map[d] || []).push({item:it, by:wearBy(w)});
  }));
  return map;
}
function shiftMonth(n){
  calMonth = calMonth || todayISO().slice(0,7);
  const [y,m] = calMonth.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  calMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  paintWear();
}
function calendarHTML(){
  calMonth = calMonth || todayISO().slice(0,7);
  const [y,m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const days = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7;          // weeks start Monday
  const map = wearsByDay();
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<div class="cal-cell cal-empty"></div>');
  for(let d=1; d<=days; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const worn = map[iso] || [];
    const isToday = iso === todayISO();
    cells.push(`<button class="cal-cell${isToday?' cal-today':''}${worn.length?' cal-has':''}" onclick="showDay('${iso}')">
      <span class="cal-n">${d}</span>
      ${worn.length ? `<span class="cal-dots">${worn.slice(0,3).map(e=>`<i style="background:${hexOf(e.item.fields.color)};box-shadow:0 0 0 1.5px ${e.by?ownerColor(e.by):'transparent'}" title="${esc(e.by||'')}"></i>`).join('')}${worn.length>3?`<em>+${worn.length-3}</em>`:''}</span>` : ''}
    </button>`);
  }
  const monthTotal = Object.entries(map).filter(([d])=>d.startsWith(calMonth)).reduce((n,[,v])=>n+v.length,0);
  const byPerson = {};
  Object.entries(map).filter(([d])=>d.startsWith(calMonth))
    .forEach(([,v])=>v.forEach(e=>{ if(e.by) byPerson[e.by] = (byPerson[e.by]||0)+1; }));
  return `<div class="cal-head">
      <button class="btn btn-sm" onclick="shiftMonth(-1)">‹</button>
      <strong>${esc(monthName(calMonth))}</strong>
      <button class="btn btn-sm" onclick="shiftMonth(1)" ${calMonth >= todayISO().slice(0,7) ? 'disabled' : ''}>›</button>
    </div>
    <div class="cal-dow">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <p class="hint" style="margin-top:.7rem">${monthTotal} wear${monthTotal===1?'':'s'} logged this month${
      Object.keys(byPerson).length ? ' — ' + Object.entries(byPerson).map(([n,c])=>esc(n)+' '+c).join(', ') : ''
    }. Tap a day to see what it was.</p>
    <div id="dayDetail"></div>`;
}
function showDay(iso){
  const worn = (wearsByDay()[iso] || []);
  const box = $('#dayDetail'); if(!box) return;
  box.innerHTML = `<div class="lifebox" style="margin-top:.8rem">
    <div class="lifebox-h">${esc(prettyDay(iso))}</div>
    ${worn.length
      ? worn.map(e=>`<div class="pick" onclick="closeModal();openDetail('${e.item.id}')">
          <div class="pick-th">${(e.item.images||[])[0]?`<img src="${esc(e.item.images[0])}" alt="">`:`<div class="ph" style="background:${hexOf(e.item.fields.color)};height:100%"></div>`}</div>
          <div class="pick-b">
            <div class="nm">${nameBlock(e.item)}</div>
            ${e.by?`<p class="hint" style="margin:.15rem 0 0"><i class="dot" style="background:${ownerColor(e.by)}"></i>${esc(e.by)}</p>`:''}
          </div>
        </div>`).join('')

/* ---- weekly roster ---- */
/* Candidates for an activity are things tagged for it; the one that has gone
   longest without a wear goes first, so use spreads instead of piling onto a
   favourite. */
function itemLabel(it){
  const b = it.fields.brand, m = it.fields.model;
  if(m) return [b,m].filter(Boolean).join(' ');
  if(b && b.toLowerCase() !== 'other') return b;
  return it.name || 'Item';
}
function candidatesFor(activity){
  const a = activity.toLowerCase().trim();
  return DB.items
    .filter(it => asArr(it.fields.purpose).some(p => String(p).toLowerCase().trim() === a))
    .sort((x,y)=>{
      const dx = daysSince(lastWorn(x)), dy = daysSince(lastWorn(y));
      return (dy === null ? 1e6 : dy) - (dx === null ? 1e6 : dx);
    });
}
/* A session isn't one thing, it's an outfit: one pick from every drawer that
   has something suitable. Two drawers gives shoes and a bag; add t-shirts and
   trousers and the same session fills out to four. Each drawer rotates through
   its own pool independently, so nothing gets over-used. */
function buildRoster(){
  return roster().map(r=>{
    const all = candidatesFor(r.activity);
    const byDrawer = DB.drawers
      .map(d => ({drawer:d, pool: all.filter(it => it.drawerId === d.id)}))
      .filter(x => x.pool.length);
    const sessions = [];
    for(let i=0; i<r.perWeek; i++){
      sessions.push(byDrawer.map(x => ({drawer:x.drawer, item:x.pool[i % x.pool.length]})));
    }
    return {...r, byDrawer, sessions, total: all.length};
  });
}
function rosterHTML(){
  const plan = buildRoster();
  const total = plan.reduce((n,r)=>n+r.perWeek,0);
  return `<p class="hint" style="margin:0 0 .9rem">How your week usually goes. Each session is filled with whatever has gone longest without a wear, so everything gets a turn.</p>
    ${plan.map((r,i)=>`
      <div class="rost">
        <div class="rost-h">
          <strong>${esc(r.activity)}</strong>
          <span class="rost-freq">
            <button class="btn btn-sm" onclick="bumpFreq(${i},-1)" ${r.perWeek<=0?'disabled':''}>−</button>
            <span>${r.perWeek}× a week</span>
            <button class="btn btn-sm" onclick="bumpFreq(${i},1)" ${r.perWeek>=14?'disabled':''}>+</button>
          </span>
          <button class="btn btn-danger btn-sm" onclick="dropActivity(${i})">Remove</button>
        </div>
        ${r.byDrawer.length
          ? `<div class="sess-list">${r.sessions.map((sess,n)=>`
              <div class="sess">
                <span class="rost-n">${n+1}</span>
                <div class="sess-items">
                  ${sess.map(s=>`
                    <button class="sess-pick" onclick="closeModal();openDetail('${s.item.id}')" title="${esc(s.drawer.name)} · ${esc(usageFlag(s.item).text)}">
                      <span class="sess-ic">${esc(s.drawer.icon||'📦')}</span>
                      <i class="dot" style="background:${hexOf(s.item.fields.color)}"></i>
                      <span class="sess-nm">${esc(itemLabel(s.item))}</span>
                    </button>`).join('')}
                </div>
              </div>`).join('')}</div>
             ${r.byDrawer.some(x=>x.pool.length < r.perWeek)
               ? `<p class="hint" style="margin:.45rem 0 0">Some repeat across the week — ${
                   r.byDrawer.filter(x=>x.pool.length < r.perWeek)
                     .map(x=>`${esc(x.drawer.name)} ${x.pool.length}`).join(', ')
                 } tagged “${esc(r.activity)}”, against ${r.perWeek} session${r.perWeek===1?'':'s'}.</p>` : ''}`
          : `<p class="hint" style="margin:.3rem 0 0">Nothing is tagged “${esc(r.activity)}” yet — add that to an item's Purpose and it'll show up here, from every drawer that has one.</p>`}
      </div>`).join('')}
    <div style="margin-top:1rem;padding-top:.9rem;border-top:1.5px solid var(--line)">
      <div class="row2">
        <div class="field" style="margin-bottom:.5rem"><label class="lbl" for="ra_name">Add an activity</label>
          <input class="input" id="ra_name" placeholder="e.g. Padel"></div>
        <div class="field" style="margin-bottom:.5rem"><label class="lbl" for="ra_freq">Times a week</label>
          <input class="input" id="ra_freq" type="number" min="1" max="14" value="1"></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="addActivity()">Add</button>
      <p class="hint" style="margin-top:.7rem">${total} session${total===1?'':'s'} a week in total.</p>
    </div>`;
}
function bumpFreq(i, d){
  const r = roster()[i]; if(!r) return;
  r.perWeek = Math.max(0, Math.min(14, r.perWeek + d));
  save(); paintWear();
}
function dropActivity(i){
  roster().splice(i,1); save(); paintWear();
}
function addActivity(){
  const name = ($('#ra_name').value||'').trim();
  const n = parseInt($('#ra_freq').value, 10);
  if(!name){ toast('Name the activity.'); return; }
  if(roster().some(r=>r.activity.toLowerCase()===name.toLowerCase())){ toast('That one is already here.'); return; }
  roster().push({activity:name, perWeek: isNaN(n) ? 1 : Math.max(1, Math.min(14, n))});
  save(); paintWear();
  toast(name + ' added.');
}

function renameUser(name){
  const v = prompt('Name for this user', name);
  if(v===null) return;
  const next = v.trim();
  if(!next || next === name) return;
  if(DB.users[next]){ toast('There is already someone with that name.'); return; }
  DB.users[next] = DB.users[name];
  delete DB.users[name];
  DB.items.forEach(i=>{ if(i.fields.owner === name) i.fields.owner = next; });
  DB.drawers.forEach(d=>d.fields.forEach(f=>{
    if(f.key==='owner' && Array.isArray(f.options))
      f.options = sortedOptions(f.options.map(o => o===name ? next : o));
  }));
  if(ME === name){ ME = next; rememberUnlock(next); }
  if(!OWNER_COLOR[next]) OWNER_COLOR[next] = pickOwnerColor(next);
  save(); renderPlates(); renderTabs(); renderRail(); renderGrid(); renderSettings();
  toast('Renamed.');
}
function addUser(){
  const name = ($('#nu_name').value||'').trim();
  const pin  = ($('#nu_pin').value||'').trim();
  if(!name){ toast('Give them a name.'); return; }
  if(DB.users[name]){ toast('There is already someone with that name.'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('The code needs to be exactly four digits.'); return; }
  DB.users[name] = {pin:hash(pin)};
  OWNER_COLOR[name] = OWNER_COLOR[name] || pickOwnerColor(name);
  DB.drawers.forEach(d=>d.fields.forEach(f=>{
    if(f.key==='owner') f.options = sortedOptions([...(f.options||[]), name]);
  }));
  save(); renderPlates(); renderRail(); renderSettings();
  toast(name + ' added.');
}
function deleteUser(name){
  const owned = DB.items.filter(i=>i.fields.owner===name).length;
  askConfirm({
    title:'Remove ' + name + '?',
    body: owned
      ? `They own <strong>${owned}</strong> thing${owned===1?'':'s'} in here. Those stay, but become unassigned.`
      : 'They own nothing in here, so nothing else changes.',
    confirmLabel:'Remove them', danger:true,
    onYes(){
      delete DB.users[name];
      DB.items.forEach(i=>{ if(i.fields.owner===name) i.fields.owner=''; });
      DB.drawers.forEach(d=>d.fields.forEach(f=>{
        if(f.key==='owner' && Array.isArray(f.options)) f.options = f.options.filter(o=>o!==name);
      }));
      if(ME === name) lockNow();
      save(); renderPlates(); renderRail(); renderGrid(); renderSettings();
      toast('Removed.');
    }
  });
}
/* Stable colour for any user beyond the first two. */
const OWNER_PALETTE = ['#6B4E9E','#B4563F','#2C6E52','#2F6FB5','#A97E30','#7A5330','#2E8B8B'];
function pickOwnerColor(name){
  let h = 0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return OWNER_PALETTE[h % OWNER_PALETTE.length];
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cabinet-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup saved to your downloads.');
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const obj = JSON.parse(r.result);
      if(!obj.items || !obj.drawers) throw 0;
      DB = obj; ACTIVE = DB.drawers[0].id;
      save(); closeModal(); renderTabs(); renderRail(); renderGrid();
      toast('Backup restored.');
    }catch(err){ toast('That file is not a Cabinet backup.'); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('Clear everything and start from the starter list? Export a backup first if you want to keep this.')) return;
  DB = seed(); ACTIVE = 'shoes';
  save(); closeModal(); renderTabs(); renderRail(); renderGrid();
  toast('Reset done.');
}

/* ---------- I2. FIRST RUN (giveaway build only) ---------------------------
   Two ways to keep things, chosen once and changeable later. Nothing leaves
   the device unless the second one is picked, and even then it goes to a
   project the person creates on their own Google account — nobody else can
   reach it, including whoever passed them this app.                       */
function showWelcome(){
  $('#lock').classList.add('hide');
  $('#modals').innerHTML = `<div class="scrim" style="background:var(--teal)">
    <div class="sheet" role="dialog" aria-modal="true" style="max-width:520px">
      <header><h2>Welcome to your Cabinet</h2></header>
      <div class="content">
        <p style="margin-top:0">Somewhere to keep track of the things you own — shoes, bags, whatever you like — with photos, filters and a four-digit lock.</p>
        <p class="lbl" style="margin-top:1.1rem">Where should it keep everything?</p>
        <button class="welcome-opt" onclick="chooseStorage('device')">
          <span class="t">Just on this device</span>
          <span class="s">Nothing is uploaded anywhere. Works offline. Only this phone or computer sees it — and only this one, so it won't appear on your other devices.</span>
        </button>
        <button class="welcome-opt" onclick="chooseStorage('cloud')">
          <span class="t">In my own Google account</span>
          <span class="s">You create a free Firebase project under your own Gmail — takes about five minutes — and everything lives there. It syncs across your devices, and you can share it with anyone you choose by giving them the same details. Nobody else can see it.</span>
        </button>
        <p class="hint" style="margin-top:1rem">You can switch later in Settings → Sync. Your code starts as <strong>1111</strong> — change it in Settings → People.</p>
      </div>
    </div>
  </div>`;
  document.body.style.overflow='hidden';
}
function chooseStorage(which){
  localStorage.setItem('cabinet.welcomed', which);
  $('#modals').innerHTML=''; document.body.style.overflow='';
  $('#lock').classList.remove('hide');
  if(which === 'cloud'){
    ME = Object.keys(DB.users)[0];
    enterApp();
    openSettings('sync');
    toast('Follow the steps under Sync to connect your Google account.');
  }
}

/* ---------- J. BOOT ------------------------------------------------------- */
(async function boot(){
  DB = await Store.load();
  if(!DB || !DB.items || !DB.drawers) { DB = seed(); await Store.save(DB); }
  if(!DB.colors) DB.colors = COLORS.slice();
  migrate();
  ACTIVE = DB.drawers[0].id;
  buildPad(); renderPlates();
  if(SHARE_MODE && !localStorage.getItem('cabinet.welcomed')) return showWelcome();
  if(restoreUnlock()) enterApp();   // a refresh shouldn't ask for the code again

  // Optional shared backend: if Settings > Sync has been configured, connect,
  // pull the latest shared copy, and keep listening for the other person's edits.
  Cloud.connect(remoteDB => {
    if(!remoteDB || !remoteDB.items || !remoteDB.drawers) return;
    DB = remoteDB;
    if(!DB.colors) DB.colors = COLORS.slice();
    migrate();
    Store.save(DB);
    if(ME && !$('#modals').innerHTML){ renderTabs(); renderRail(); renderGrid(); toast('Updated from the shared cabinet.'); }
  }).then(async connected => {
    if(!connected) return;
    const remote = await Cloud.pull();
    if(remote && remote.items && remote.drawers){
      DB = remote; if(!DB.colors) DB.colors = COLORS.slice(); migrate();
      await Store.save(DB);
    } else {
      await Cloud.push(DB, true); // first connection — seed the shared database, quietly
    }
    if(!DB.drawers.find(d=>d.id===ACTIVE)) ACTIVE = DB.drawers[0].id;
    if(ME){ renderTabs(); renderRail(); renderGrid(); }
    renderPlates();
    startChat();
  });

  registerServiceWorker();
})();

/* ---------- K. INSTALLING AS AN APP ---------------------------------------
   The manifest and icons are real files next to this one, and the service
   worker caches the app shell — so on Android/desktop Chrome the browser
   offers a proper install, and on iOS "Add to Home Screen" gives a
   standalone window. Once installed it opens without browser chrome and
   still works with no signal (your own copy loads; syncing resumes when
   the connection is back).                                               */
function registerServiceWorker(){
  if(!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline support unavailable:', e));
}

let deferredInstall = null;
const isStandalone = () =>
  window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if(!isStandalone()) $('#installBtn')?.classList.remove('hide');
});
window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  $('#installBtn')?.classList.add('hide');
  toast('Installed. Open it from your home screen.');
});
/* iOS never fires beforeinstallprompt, so offer the manual route there. */
document.addEventListener('DOMContentLoaded', () => {
  if(isIOS() && !isStandalone()) $('#installBtn')?.classList.remove('hide');
});

function installApp(){
  if(deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(()=>{ deferredInstall = null; });
    return;
  }
  showModal(`<div class="sheet" role="dialog" aria-modal="true">
    <header><h2>Put Cabinet on your home screen</h2>
      <button class="btn btn-quiet btn-sm" onclick="closeModal()">Close</button></header>
    <div class="content">
      <p style="margin-top:0">${isIOS()
        ? 'In Safari, tap the Share button at the bottom of the screen, scroll down, and choose <strong>Add to Home Screen</strong>.'
        : 'In your browser menu, choose <strong>Install app</strong> or <strong>Add to Home Screen</strong>.'}</p>
      <p class="hint">It opens like any other app after that — its own icon, no address bar, and it still works when you have no signal.</p>
    </div>
  </div>`);
}
</script>
</body>
